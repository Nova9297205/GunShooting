<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEAD NIGHTS 2D</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- タイトル -->
    <section id="screen-title" class="screen">
      <div class="card">
        <h1>DEAD <span>NIGHTS</span> 2D</h1>
        <p class="tagline">2〜3人協力 ゾンビサバイバル＆拠点防衛 ― 5日ごとに大襲撃がやってくる</p>
        <label class="field">
          <span>プレイヤー名（最大10文字）</span>
          <input id="input-name" maxlength="10" placeholder="未入力なら P1〜P3" autocomplete="off" spellcheck="false" />
        </label>
        <button id="btn-solo" class="btn">ソロで開始</button>
        <button id="btn-host" class="btn primary">部屋を作る（ホスト）</button>
        <div class="join-row">
          <input id="input-code" class="code-input" maxlength="6" placeholder="ルームID" autocomplete="off" spellcheck="false" />
          <button id="btn-join" class="btn">部屋に参加（ゲスト）</button>
        </div>
        <p id="title-status" class="status"></p>
        <details class="controls">
          <summary>操作方法</summary>
          <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動 / <kbd>マウス</kbd> 照準（夜は懐中電灯）</div>
          <div><kbd>左クリック</kbd> 射撃・斧・建築・修理 / <kbd>R</kbd> リロード / <kbd>Shift</kbd> ダッシュ</div>
          <div><kbd>1</kbd>拳銃 <kbd>2</kbd>斧 <kbd>3</kbd>木の壁 <kbd>4</kbd>鉄の壁 <kbd>5</kbd>スパイク <kbd>6</kbd>修理（<kbd>B</kbd>/ホイールでも切替）</div>
          <div><kbd>F</kbd> クレートを調べる／アイテム使用 / <kbd>Q</kbd> 食事 / <kbd>H</kbd> 救急キット / <kbd>C</kbd> 火薬→弾薬</div>
          <div><kbd>E</kbd> 長押しでダウンした味方を蘇生</div>
        </details>
      </div>
    </section>

    <!-- ロビー -->
    <section id="screen-lobby" class="screen hidden">
      <div class="card">
        <h2>ロビー</h2>
        <div class="room">
          <span class="label">ルームID</span>
          <span id="room-code" class="code">------</span>
          <button id="btn-copy" class="btn small">コピー</button>
        </div>
        <ul id="lobby-list" class="slots"></ul>
        <p id="lobby-status" class="status"></p>
        <button id="btn-start" class="btn primary">ゲーム開始</button>
        <button id="btn-leave" class="btn ghost">タイトルへ戻る</button>
      </div>
    </section>

    <!-- リザルト -->
    <section id="screen-result" class="screen hidden">
      <div class="card">
        <h2 class="gameover">YOU DIED</h2>
        <p class="wave-reached">生存日数: <strong id="result-day">1</strong> 日</p>
        <table class="result-table">
          <thead><tr><th>プレイヤー</th><th>撃破数</th><th>建築数</th></tr></thead>
          <tbody id="result-body"></tbody>
        </table>
        <button id="btn-result-back" class="btn primary">ロビーへ戻る</button>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
